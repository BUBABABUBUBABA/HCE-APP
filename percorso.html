<style>
*{box-sizing:border-box}
body{margin:0;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;border-bottom:2px solid var(--line2)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:900;font-size:.9rem;box-shadow:0 3px 0 var(--accent-dk)}
.cnt{display:flex;gap:18px;font-weight:900;font-size:1.05rem}
.cnt span{display:flex;gap:6px;align-items:center}
.cnt .fire{color:var(--fire)}.cnt .fire.off{color:var(--muted);filter:grayscale(1);opacity:.7}.cnt .xp{color:var(--star-dk)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cnt .xp{color:var(--star)}}
:root[data-theme="dark"] .cnt .xp{color:var(--star)}
.hi h1{font-size:1.8rem;line-height:1.1}
.hi p{color:var(--muted);font-weight:700;margin-top:4px}
.goal{display:flex;align-items:center;gap:10px}
.gbar{flex:1;height:16px;border-radius:99px;background:var(--line2);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok-bg);border-radius:99px;transition:width .4s}
.goal b{font-weight:900;color:var(--ok);min-width:3ch;text-align:right}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--accent-dk)}
.hero small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:900;opacity:.85}
.hero h2{font-size:1.35rem;line-height:1.2;color:inherit}
.hero p{font-weight:700;opacity:.9;font-size:.95rem}
.big{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:16px;font-weight:900;letter-spacing:.06em;text-decoration:none;font-size:1rem;border:0;cursor:pointer;font-family:inherit}
.big.w{background:var(--surface);color:var(--accent);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big.g{background:var(--ok-bg);color:#fff;box-shadow:0 4px 0 var(--ok-dk)}
.big:active{transform:translateY(3px);box-shadow:none}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qk{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 3px 0 var(--line)}
.qk:active{transform:translateY(2px);box-shadow:none}
.qk .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c-soft);color:var(--c);margin-bottom:4px}
.qk b{font-weight:900}.qk span{font-size:.84rem;color:var(--muted);font-weight:700}
.sec-t{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--muted);text-align:center}
.path{display:flex;flex-direction:column;gap:6px;align-items:center;padding:4px 0 10px}
.unit{width:100%;margin:14px 0 8px;border-radius:18px;padding:12px 16px;background:var(--uc);color:var(--accent-fg);display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit b{font-weight:900;font-size:1.05rem}.unit span{font-weight:800;font-size:.85rem;opacity:.9}
.node{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg);width:250px;max-width:80%;min-height:76px}
.nd{flex:none;width:68px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--line2);box-shadow:0 5px 0 var(--line);color:var(--muted);font-weight:900;font-size:1.05rem;position:relative}
.node.done .nd{background:var(--ok-bg);box-shadow:0 5px 0 var(--ok-dk);color:#fff}
.node.prog .nd{background:var(--accent-soft);box-shadow:0 5px 0 var(--line);color:var(--accent)}
.node.cur .nd{background:var(--accent);box-shadow:0 5px 0 var(--accent-dk);color:var(--accent-fg);outline:5px solid var(--accent-soft);outline-offset:4px}
.node:active .nd{transform:translateY(3px);box-shadow:none}
.nl{display:flex;flex-direction:column;min-width:0}
@media (max-width:380px){.node{transform:none!important;width:100%;max-width:100%}}
.nl b{font-weight:900;line-height:1.2}.nl span{font-size:.82rem;color:var(--muted);font-weight:700}
.node.cur .nl span{color:var(--accent)}
.card{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.2rem}
.btn{padding:10px 16px;font:inherit;cursor:pointer;background:var(--surface);color:var(--fg);min-height:46px;display:inline-flex;align-items:center;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.88rem;font-weight:600}
.msg{border-radius:14px;padding:10px 12px;font-size:.9rem;font-weight:700}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.err{background:var(--warn-soft);color:var(--warn)}
details.set{border-top:2px solid var(--line2);padding-top:10px}
details.set summary{cursor:pointer;font-weight:900;min-height:40px;display:flex;align-items:center}
ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:.92rem}
input[type=file]{display:none}
.welcome{text-align:center;align-items:center}
.welcome .em{width:96px;height:96px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.cap summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px;justify-content:center}.cap summary::-webkit-details-marker{display:none}.cap summary b{font-size:1.1rem;font-weight:900}
.cap summary::after{content:"Apri";font-weight:800;color:var(--accent);font-size:.86rem}.cap[open] summary::after{content:"Chiudi"}
#cap-b{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.capr{display:flex;flex-direction:column;gap:4px}.capt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.capt b{font-weight:800}.capt span{color:var(--muted);font-weight:700;font-size:.86rem}
.capbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--sunk)}.capbar i{display:block;height:100%}.capbar .s{background:var(--ok-bg)}.capbar .q{background:var(--star)}.capbar .n{background:var(--warn)}
.caprev{display:flex;gap:10px;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--fg);min-height:44px}
.caprev span:first-child{display:flex;flex-direction:column;min-width:0}.caprev b{font-weight:800}.caprev small{color:var(--muted);font-weight:700}
</style>
<div class="page">
<div class="top">
  <div class="logo" aria-hidden="true">HCE</div>
  <div class="cnt">
    <span class="fire" id="s-fire" title="Giorni di fila"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg><b id="s-streak">0</b><span class="sr" style="position:absolute;left:-9999px">giorni di fila</span></span>
    <span class="xp" title="Punti esperienza"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><b id="s-xp">0</b> XP</span>
  </div>
</div>
<header class="hi"><h1>Il tuo percorso</h1><p>21 livelli e i webinar, in ordine. Tocca una tappa per aprire il primo modulo che non hai ancora studiato.</p></header>
<div class="hero">
  <small id="h-eb">Continua</small>
  <h2 id="h-t">…</h2>
  <p id="h-s"></p>
  <a class="big w" id="h-go" href="studio.html">CONTINUA</a>
</div>
<a class="qk" href="studio.html" style="--c:var(--c1);--c-soft:var(--accent-soft);flex-direction:row;align-items:center;gap:12px"><span class="ic" style="margin:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg></span><span style="display:flex;flex-direction:column;gap:2px;color:var(--fg)"><b>Studio sulla ruota HCE</b><span id="q-mods">Moduli, webinar e libri per aspetto</span></span></a>
<details class="card cap" id="cap" hidden><summary><b>Quanto hai capito</b><span id="cap-s" class="muted"></span></summary><div id="cap-b"></div></details>
<div class="path" id="path"></div>
</div>
<script>
HCE.ready(function(p){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var PCOL={Connection:'var(--c1)',Improve:'var(--c2)',Inside:'var(--c4)',Persuasion:'var(--c5)',Sales:'var(--c3)',Team:'var(--q-teal)',Webinar:'var(--muted)'};
var OFF=[0,46,70,46,0,-46,-70,-46];
function draw(){
  var S=HCE.stats(),D=p.data;
  $('s-streak').textContent=S.streak;$('s-fire').classList.toggle('off',!S.today);$('s-xp').textContent=S.xp;
  var done=S.done,LV={},byL={};
  D.levels.forEach(function(l){LV[l.k]=l;byL[l.k]=[]});
  D.mods.forEach(function(m){if(byL[m.l])byL[m.l].push(m)});
  // continua: primo modulo non studiato nel livello in corso
  var next=null;
  for(var i=0;i<D.levels.length&&!next;i++){var ms=byL[D.levels[i].k];for(var j=0;j<ms.length;j++){if(!(done[ms[j].id]>0)){next=ms[j];break}}}
  if(next){var L=LV[next.l],ms2=byL[next.l],n=ms2.filter(function(m){return done[m.id]>0}).length;
    $('h-eb').textContent=(n?'Continua · ':'Inizia · ')+L.p;
    $('h-t').textContent=L.n+' · Modulo '+(ms2.indexOf(next)+1);
    $('h-s').textContent=next.t;
    $('h-go').href='studio.html#m='+next.id;$('h-go').textContent=n?'CONTINUA':'INIZIA';}
  else{$('h-eb').textContent='Percorso completato';$('h-t').textContent='Hai studiato tutti i moduli';$('h-s').textContent='Ripassa dalla ruota o allenati con il D-P-I.';$('h-go').href='studio.html';$('h-go').textContent='RIPASSA'}
  $('q-mods').textContent=S.mods+' di '+D.mods.length+' moduli studiati';
  // percorso
  var html='',lastP='',k=0,curSet=false;
  D.levels.forEach(function(l){
    var ms=byL[l.k],nd=ms.filter(function(m){return done[m.id]>0}).length,tot=ms.length;if(!tot)return;
    if(l.p!==lastP){lastP=l.p;var pl=D.levels.filter(function(x){return x.p===l.p}),pd=0,pt=0;pl.forEach(function(x){pt+=byL[x.k].length;pd+=byL[x.k].filter(function(m){return done[m.id]>0}).length});
      html+='<div class="unit" style="--uc:'+(PCOL[l.p]||'var(--accent)')+'"><b>'+esc(l.p)+'</b><span>'+pd+'/'+pt+'</span></div>';k=0}
    var st=nd===tot?'done':'';var first=ms.filter(function(m){return!(done[m.id]>0)})[0]||ms[0];
    if(!st&&!curSet&&next&&next.l===l.k){st='cur';curSet=true}else if(!st&&nd)st='prog';
    var ic=st==='done'?'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>':st==='cur'?'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>':esc(l.n.charAt(0));
    html+='<a class="node '+st+'" href="studio.html#m='+first.id+'" style="transform:translateX('+OFF[k%OFF.length]+'px)"><span class="nd">'+ic+'</span><span class="nl"><b>'+esc(l.n)+'</b><span>'+(st==='cur'?'Sei qui · ':'')+nd+'/'+tot+' moduli</span></span></a>';k++;
  });
  $('path').innerHTML=html;
  // comprensione: dalle flashcard di «Esercitati» (ultima volta che hai fatto il test di ogni modulo)
  var ex=HCE.lsJ('ex_v1',{}),MI={},per={},rev=[],tot={si:0,quasi:0,no:0};D.mods.forEach(function(m){MI[m.id]=m});
  Object.keys(ex).forEach(function(id){var r=(ex[id]||{}).r,m=MI[id];if(!r||!m)return;var c={si:0,quasi:0,no:0};Object.keys(r).forEach(function(i){if(c[r[i]]!=null){c[r[i]]++;tot[r[i]]++}});
    var L=per[m.l]=per[m.l]||{si:0,quasi:0,no:0,n:0};L.si+=c.si;L.quasi+=c.quasi;L.no+=c.no;L.n++;
    if(c.no||c.quasi)rev.push({m:m,c:c,t:ex[id].tl||ex[id].t1||0})});
  var all=tot.si+tot.quasi+tot.no;$('cap').hidden=!all;
  if(all){$('cap-s').textContent=Math.round(100*tot.si/all)+'% di risposte sapute · '+Object.keys(per).reduce(function(a,k){return a+per[k].n},0)+' moduli testati';
    var h='<p class="muted">Dalle flashcard di «Esercitati»: conta l\'ultima volta che hai fatto il test di ogni modulo. Verde = lo sapevo, giallo = quasi, rosso = no.</p>';
    h+=D.levels.filter(function(l){return per[l.k]}).map(function(l){var x=per[l.k],n=x.si+x.quasi+x.no;return '<div class="capr"><div class="capt"><b>'+esc(l.n)+'</b><span>'+Math.round(100*x.si/n)+'% · '+x.n+' '+(x.n===1?'modulo':'moduli')+'</span></div><div class="capbar" role="img" aria-label="'+x.si+' sapute, '+x.quasi+' quasi, '+x.no+' no"><i class="s" style="width:'+(100*x.si/n)+'%"></i><i class="q" style="width:'+(100*x.quasi/n)+'%"></i><i class="n" style="width:'+(100*x.no/n)+'%"></i></div></div>'}).join('');
    rev.sort(function(a,b){return (b.c.no*2+b.c.quasi)-(a.c.no*2+a.c.quasi)||b.t-a.t});
    if(rev.length)h+='<div class="lbl" style="margin-top:6px">Da rivedere</div>'+rev.slice(0,8).map(function(x){return '<a class="caprev" href="studio.html#x='+x.m.id+'"><span><b>'+esc(x.m.t)+'</b><small>'+esc(LV[x.m.l]?LV[x.m.l].n:'')+' · '+(x.c.no?x.c.no+' no':'')+(x.c.no&&x.c.quasi?', ':'')+(x.c.quasi?x.c.quasi+' quasi':'')+'</small></span><span aria-hidden="true">›</span></a>'}).join('')+(rev.length>8?'<p class="muted">E altri '+(rev.length-8)+'.</p>':'');
    else h+='<p class="muted">Nessun modulo da rivedere.</p>';
    $('cap-b').innerHTML=h}
}
draw();window.addEventListener('pageshow',function(e){if(e.persisted)draw()});
});
</script>

<style>
/* Tema "gioco": colori, caratteri arrotondati, pulsanti in rilievo. Caricato dopo gli stili di ogni pagina. */
:root{
 --bg:#F7F8FC;--surface:#FFFFFF;--sunk:#F1F3F9;--fg:#1B2240;--muted:#5A6385;--line:#E3E7F0;--line2:#EDF0F6;
 --accent:#2459E0;--accent-dk:#1B46B8;--accent-fg:#FFFFFF;--accent-soft:#EAF0FF;
 --star:#F5A524;--star-dk:#C98408;--star-soft:#FFF4DE;--warn:#C2410C;--warn-soft:#FFEDE3;
 --ok:#12805A;--ok-bg:#1FB37A;--ok-dk:#138A5C;--ok-soft:#E3F7EE;--fire:#FF8A3D;
 --c1:#2459E0;--c2:#12805A;--c3:#9A6400;--c4:#7C3AED;--c5:#D32F2F;
 --d:#2459E0;--d-soft:#EAF0FF;--p:#7C3AED;--p-soft:#F3EEFF;--i:#C2410C;--i-soft:#FFEDE3;
 --shadow:none;--lift:0 3px 0 var(--line);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0F1426;--surface:#182038;--sunk:#131A30;--fg:#EEF1FA;--muted:#A3ACC9;--line:#2A3459;--line2:#222B4A;
 --accent:#6F97FF;--accent-dk:#3F66D6;--accent-fg:#0B1020;--accent-soft:#1D2A52;
 --star:#FFC247;--star-dk:#B88310;--star-soft:#3A2F14;--warn:#FF9B6A;--warn-soft:#3B2318;
 --ok:#4FD69C;--ok-bg:#2FBF83;--ok-dk:#1B7F56;--ok-soft:#14352A;--fire:#FF9D5C;
 --c1:#7EA2FF;--c2:#4FD69C;--c3:#FFC247;--c4:#B69CFF;--c5:#FF8A80;
 --d:#7EA2FF;--d-soft:#1D2A52;--p:#B69CFF;--p-soft:#2A2350;--i:#FF9B6A;--i-soft:#3B2318;
 --shadow:none;--lift:0 3px 0 var(--line);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F1426;--surface:#182038;--sunk:#131A30;--fg:#EEF1FA;--muted:#A3ACC9;--line:#2A3459;--line2:#222B4A;
 --accent:#6F97FF;--accent-dk:#3F66D6;--accent-fg:#0B1020;--accent-soft:#1D2A52;
 --star:#FFC247;--star-dk:#B88310;--star-soft:#3A2F14;--warn:#FF9B6A;--warn-soft:#3B2318;
 --ok:#4FD69C;--ok-bg:#2FBF83;--ok-dk:#1B7F56;--ok-soft:#14352A;--fire:#FF9D5C;
 --c1:#7EA2FF;--c2:#4FD69C;--c3:#FFC247;--c4:#B69CFF;--c5:#FF8A80;
 --d:#7EA2FF;--d-soft:#1D2A52;--p:#B69CFF;--p-soft:#2A2350;--i:#FF9B6A;--i-soft:#3B2318;
 --shadow:none;--lift:0 3px 0 var(--line);color-scheme:dark}

html body,html body *:not(svg):not(svg *):not(code):not(pre){font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html body svg text{font-family:Nunito,system-ui,sans-serif!important}
body{background:var(--bg);color:var(--fg);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
h1,h2,h3{font-weight:900!important;letter-spacing:-.01em}
h1{font-size:1.9rem}
.eyebrow,.ph,.area{font-weight:800!important}

/* schede */
.card,.hist,.mod,details.lv,.ig{border:2px solid var(--line)!important;border-radius:20px!important;box-shadow:var(--lift)!important}
.mod.done{background:var(--ok-soft)!important;border-color:var(--ok-bg)!important;box-shadow:0 3px 0 var(--ok-bg)!important}

/* pulsanti in rilievo */
.btn{border-radius:14px!important;font-weight:800!important;letter-spacing:.02em;border:2px solid var(--line)!important;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.btn.pri,.dpi .btn:not(.sec):not(.on){background:var(--accent)!important;color:var(--accent-fg)!important;border-color:var(--accent)!important;box-shadow:0 4px 0 var(--accent-dk)}
.btn:active,.chk:active,.star:active,.ch:active,.scale button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pri:active{box-shadow:0 1px 0 var(--accent-dk)}
