<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SLCC</title>
<meta name="theme-color" content="#1f5a5e">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.appbar{display:flex;gap:4px;padding:10px 0 2px;max-width:1200px;margin:0 auto;overflow-x:auto}
.appbar a{font:600 .82rem/1 Inter,system-ui,sans-serif;text-decoration:none;color:var(--muted,#5d6869);padding:9px 12px;border-radius:99px;white-space:nowrap}
.appbar a[aria-current]{background:var(--accent-soft,#d9e9e7);color:var(--accent,#1f5a5e)}
.loading{font:15px/1.5 system-ui,sans-serif;padding:40px 16px;text-align:center;color:#5d6869}
</style>
<script src="hce.js"></script>
</head><body>
<script>HCE.nav("tool");</script>
<style>
:root{--onp:#FFFFFF;--sl:#07626B;--sl-s:#E3F6F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onp:#0B1020;--sl:#5FD3DE;--sl-s:#12313A}}
:root[data-theme="dark"]{--onp:#0B1020;--sl:#5FD3DE;--sl-s:#12313A}
*{box-sizing:border-box}
body{margin:0;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
p{margin:0}
header{padding-top:22px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sl);font-weight:900}
h1{font-size:1.9rem;line-height:1.1;margin:0}h2{font-size:1.3rem;margin:0}h3{font-size:1.05rem;margin:0}
.lead{color:var(--muted);font-weight:600}
nav.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;cursor:pointer;min-height:44px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.tip{font-size:.88rem;color:var(--muted);font-weight:600;line-height:1.45}
.note{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600;color:var(--muted);line-height:1.45}
.src{display:inline-flex;font-size:.8rem;font-weight:800;color:var(--accent);background:var(--sunk);border-radius:99px;padding:7px 12px;text-decoration:none;align-self:flex-start;min-height:36px;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.92rem}
textarea,input[type=text],select{width:100%;font:inherit;padding:10px 12px;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;font:inherit;cursor:pointer;background:var(--surface);color:var(--fg);min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.sl{background:var(--sl);color:var(--onp);border-color:var(--sl);font-weight:900}
.msg{border-radius:12px;padding:9px 12px;font-weight:800;font-size:.88rem;background:var(--ok-soft);color:var(--ok)}
.grp{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--sl);margin-top:6px}
.ent{border-radius:20px;border:2px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:0 3px 0 var(--line)}
.ent summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:62px}
.ent summary::-webkit-details-marker{display:none}
.ent .L{flex:none;width:46px;height:46px;border-radius:14px;background:var(--sl-s);color:var(--sl);display:grid;place-items:center;font-weight:900;font-size:1rem}
.ent summary b{font-weight:900;font-size:1.05rem;display:block}.ent summary small{display:block;color:var(--muted);font-weight:700;font-size:.84rem}
.ent .chev{margin-left:auto;color:var(--muted);transition:transform .15s;flex:none}.ent[open] .chev{transform:rotate(90deg)}
.sb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.face{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.face b{font-weight:900;color:var(--sl)}.face span{font-weight:600;line-height:1.4}.face ul{margin:0;padding-left:18px;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.45}
.say{background:var(--sunk);border-left:4px solid var(--sl);border-radius:10px;padding:10px 12px;font-weight:700;line-height:1.45}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:2px solid var(--line2);padding-top:10px}
.pr .nm b{font-weight:900}.pr .nm small{display:block;color:var(--muted);font-weight:700;font-size:.8rem;line-height:1.35}
.seg{display:flex;gap:4px}.seg button{font:inherit;font-weight:800;font-size:.84rem;padding:8px 10px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sl);border-color:var(--sl);color:var(--onp)}
@media (max-width:520px){.pr{grid-template-columns:minmax(0,1fr)}}
.item{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-weight:900}.item .tx span{font-size:.82rem;color:var(--muted);font-weight:700}
.adv{display:flex;flex-direction:column;gap:8px}.adv div{border-radius:12px;padding:10px 12px;background:var(--sunk);line-height:1.45;font-weight:600}.adv div b{font-weight:900}
.adv div.k{background:var(--sl-s)}
.step{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.step .h{display:flex;gap:10px;align-items:center}.step .h .L{flex:none;width:36px;height:36px;border-radius:11px;background:var(--sl);color:var(--onp);display:grid;place-items:center;font-weight:900}
.step .h b{font-weight:900}
.muted{color:var(--muted);font-size:.86rem;font-weight:600}
.notice{text-align:center;align-items:center}
</style>
<div class="page">
<header>
  <div class="eyebrow">HCE · Connection · SLCC</div>
  <h1>SLCC</h1>
  <p class="lead">Come ragiona l'altro: 15 preferenze, ognuna con due facce. Riconoscile dalle parole esatte e parla nella sua lingua.</p>
</header>
<div id="bk-tips" data-tool="slcc"></div>
<div class="card notice" id="old" hidden><h2>Serve il file dei contenuti aggiornato</h2><p class="muted">Importa la versione nuova di hce-contenuti.json dalla Home, in Impostazioni.</p><a class="btn pri" href="index.html#contenuti">Vai alla Home</a></div>
<div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
  <nav class="tb"><div class="tabs">
    <button class="tab" data-t="profilo" aria-selected="true">Profilo</button>
    <button class="tab" data-t="combo" aria-selected="false">MICRO e MACRO</button>
    <button class="tab" data-t="lista" aria-selected="false">Le 15</button>
    <button class="tab" data-t="regole" aria-selected="false">Regole</button>
  </div></nav>
  <section id="v-profilo"></section>
  <section id="v-combo" hidden></section>
  <section id="v-lista" hidden></section>
  <section id="v-regole" hidden></section>
</div>
</div>
<script>
HCE.ready(function(PACK){
var Z=PACK.slcc,$=function(i){return document.getElementById(i)};
if(!Z){$('old').hidden=false;return}
$('app').hidden=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var MODT={};PACK.data.mods.forEach(function(m){MODT[m.id]=m.t});
function ml(id){return id?'<a class="src" href="studio.html#m='+id+'">↗ SLCC '+id.slice(2)+' · '+esc(MODT[id]||'')+'</a>':''}
function ul(a){return '<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}
var BY={};Z.list.forEach(function(s){BY[s.k]=s});
var PK='slcc_v1',MK='slcc_msg_v1';
function people(){return HCE.lsJ(PK,[])}
function savePerson(x){var a=people(),i=a.findIndex(function(y){return y.id===x.id});x.u=Date.now();if(i>=0)a[i]=x;else a.unshift(x);HCE.lsPut(PK,a)}

/* ---------- LE 15 ---------- */
function card(s){return '<details class="ent" id="s-'+s.k+'"><summary><span class="L">'+esc(s.n.slice(0,2))+'</span><span><b>'+esc(s.n)+'</b><small>'+esc(s.a)+' / '+esc(s.b)+'</small></span><span class="chev">›</span></summary><div class="sb">'+
  '<div class="two"><div class="face"><b>'+esc(s.a)+'</b><span>'+esc(s.ad)+'</span>'+ul(s.ra)+'</div><div class="face"><b>'+esc(s.b)+'</b><span>'+esc(s.bd)+'</span>'+ul(s.rb)+'</div></div>'+
  (s.pro?'<div class="say"><span class="lbl" style="display:block">Proattivo, senza indizi</span>'+esc(s.pro)+'</div>':'')+
  '<p class="tip">'+esc(s.tip)+'</p>'+ml(s.m)+'</div></details>'}
function renderLista(){var h='';Z.cats.forEach(function(c){var l=Z.list.filter(function(s){return s.cat===c[0]});if(!l.length)return;h+='<div class="grp">'+esc(c[0])+' · '+esc(c[1])+'</div>'+l.map(card).join('')});
  h+='<div class="card"><h3>I tre strumenti</h3>'+Z.tools.map(function(t){return '<div><b>'+esc(t[0])+'</b><p class="tip">'+esc(t[1])+'</p></div>'}).join('')+ml(Z.tools_m)+'</div>';
  $('v-lista').innerHTML=h}

/* ---------- PROFILO ---------- */
var CUR=null;
function advice(p){var known=[],unk=[];Z.list.forEach(function(s){var f=(p.p||{})[s.k];if(f)known.push([s,f]);else unk.push(s)});
  var h='';
  if(known.length)h+=known.map(function(x){var s=x[0],face=x[1]==='a'?s.a:s.b,d=x[1]==='a'?s.ad:s.bd,other=x[1]==='a'?s.b:s.a;return '<div class="k"><b>'+esc(s.n)+': '+esc(face)+'.</b> Parla nella sua: '+esc(d)+'. Poi, se serve, un tocco di '+esc(other)+'.</div>'}).join('');
  var pro=unk.filter(function(s){return s.pro});
  if(pro.length)h+='<div><b>Dove non sai:</b> usa entrambe le facce, in quest\'ordine.<br>'+pro.map(function(s){return esc(s.n)+': '+esc(s.pro)}).join('<br>')+'</div>';
  return h||'<div>Segna almeno una preferenza per avere i consigli.</div>'}
function renderProfilo(){var a=people(),h='';
  if(!CUR){h+='<div class="card"><h3>Profila una persona</h3><p class="tip">Ascolta le sue parole esatte e osserva cosa fa e com\'è il suo ambiente. Segna solo ciò che hai notato: il resto lascialo su «?». Vale per questo momento e questo contesto, non è un\'etichetta.</p>'+
     '<label class="f">Nome<input type="text" id="p-new" placeholder="Es. Marco, il cliente di giovedì"></label><div class="row"><button class="btn sl" id="p-add">Crea profilo</button></div></div>';
    if(a.length)h+='<div class="card"><h3>I miei profili</h3>'+a.map(function(x){var n=Object.keys(x.p||{}).length;return '<div class="item"><div class="tx"><b>'+esc(x.n)+'</b><span>'+n+' preferenze su 15 · '+new Date(x.u||+x.id).toLocaleDateString('it-IT')+'</span></div><button class="btn" data-open="'+x.id+'">Apri</button></div>'}).join('')+'</div>';
    $('v-profilo').innerHTML=h;return}
  var p=CUR;
  h+='<div class="row"><button class="btn" id="p-back">← Profili</button></div>';
  h+='<div class="card"><label class="f">Nome<input type="text" data-pn="1" value="'+esc(p.n)+'"></label><label class="f">Contesto (facoltativo)<input type="text" data-pc="1" value="'+esc(p.c||'')+'" placeholder="Es. riunione sul budget, al telefono"></label></div>';
  h+='<div class="card"><h3>Cosa hai notato</h3>';
  Z.cats.forEach(function(c){var l=Z.list.filter(function(s){return s.cat===c[0]});h+='<div class="grp">'+esc(c[0])+'</div>'+l.map(function(s){var v=(p.p||{})[s.k]||'';
    return '<div class="pr"><div class="nm"><b>'+esc(s.n)+'</b><small>'+esc(s.a)+': '+esc(s.ra[0])+' · '+esc(s.b)+': '+esc(s.rb[0])+'</small></div><div class="seg" role="group" aria-label="'+esc(s.n)+'"><button data-f="'+s.k+'" data-v="a" aria-pressed="'+(v==='a')+'">'+esc(s.a)+'</button><button data-f="'+s.k+'" data-v="" aria-pressed="'+(!v)+'">?</button><button data-f="'+s.k+'" data-v="b" aria-pressed="'+(v==='b')+'">'+esc(s.b)+'</button></div></div>'}).join('')});
  h+='</div><div class="card"><h3>Come parlargli</h3><div class="adv" id="adv">'+advice(p)+'</div><div class="row"><button class="btn sl" data-go-combo="MICRO">Scrivi un messaggio MICRO</button><button class="btn" data-go-combo="MACRO">MACRO</button></div></div>';
  h+='<div class="row"><button class="btn" id="p-del">Elimina profilo</button></div>';
  $('v-profilo').innerHTML=h}
$('v-profilo').addEventListener('click',function(e){var b,t=e.target;
  if(t.id==='p-add'){var n=$('p-new').value.trim();if(!n)return;CUR={id:String(Date.now()),n:n,p:{}};savePerson(CUR);renderProfilo();window.scrollTo(0,0);return}
  if(b=t.closest('[data-open]')){CUR=people().filter(function(x){return x.id===b.dataset.open})[0]||null;renderProfilo();window.scrollTo(0,0);return}
  if(t.id==='p-back'){CUR=null;renderProfilo();return}
  if(b=t.closest('[data-f]')){CUR.p=CUR.p||{};if(b.dataset.v)CUR.p[b.dataset.f]=b.dataset.v;else delete CUR.p[b.dataset.f];savePerson(CUR);
    Array.prototype.forEach.call(b.parentNode.children,function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});$('adv').innerHTML=advice(CUR);return}
  if(b=t.closest('[data-go-combo]')){COMBO.k=b.dataset.goCombo;COMBO.who=CUR.id;show('combo');return}
  if(t.id==='p-del'){if(t.textContent!=='Elimina?'){t.textContent='Elimina?';return}HCE.lsPut(PK,people().filter(function(x){return x.id!==CUR.id}));CUR=null;renderProfilo()}});
$('v-profilo').addEventListener('input',function(e){if(!CUR)return;if(e.target.dataset.pn){CUR.n=e.target.value;savePerson(CUR)}if(e.target.dataset.pc){CUR.c=e.target.value;savePerson(CUR)}});

/* ---------- MICRO e MACRO ---------- */
var COMBO={k:'MICRO',who:'',f:{},obj:''};
function renderCombo(){var C=Z.combos.filter(function(c){return c.k===COMBO.k})[0],ps=people(),who=ps.filter(function(x){return x.id===COMBO.who})[0];
  var h='<div class="card"><div class="row" role="group" aria-label="Combinazione">'+Z.combos.map(function(c){return '<button class="btn'+(c.k===COMBO.k?' sl':'')+'" data-ck="'+c.k+'">'+esc(c.n)+'</button>'}).join('')+'</div>'+
   '<p><b>'+esc(C.n)+'</b> = '+C.seq.map(function(k){return esc(BY[k].n)}).join(', ')+'. '+esc(C.d)+'</p><p class="note">'+esc(Z.combo_note)+'</p>'+
   '<label class="f">Per chi (facoltativo)<select id="c-who"><option value="">Nessun profilo: uso l\'ordine proattivo</option>'+ps.map(function(x){return '<option value="'+x.id+'"'+(x.id===COMBO.who?' selected':'')+'>'+esc(x.n)+'</option>'}).join('')+'</select></label>'+
   '<label class="f">Cosa vuoi ottenere<input type="text" id="c-obj" value="'+esc(COMBO.obj)+'" placeholder="Es. che il team adotti il nuovo metodo"></label></div>';
  h+='<div class="card"><h3>Il messaggio, lettera per lettera</h3>'+C.seq.map(function(k,i){var s=BY[k],f=who&&who.p?who.p[k]:'';
    var how=f?'Con '+esc(who.n)+' ('+esc(f==='a'?s.a:s.b)+'): parti dalla sua, '+esc(f==='a'?s.a:s.b)+', poi '+esc(f==='a'?s.b:s.a)+'.':(s.pro?esc(s.pro):'Usa entrambe le facce: '+esc(s.a)+' e '+esc(s.b)+'.');
    return '<div class="step"><div class="h"><span class="L">'+C.k.charAt(i)+'</span><b>'+esc(s.n)+'</b></div><p class="tip">'+how+'</p><textarea data-cf="'+k+'" aria-label="'+esc(s.n)+'">'+esc(COMBO.f[k]||'')+'</textarea></div>'}).join('')+
   '<div class="row"><button class="btn sl" id="c-save">Salva il messaggio · +15 XP</button></div><div id="c-msg"></div><div class="row">'+ml(C.m)+ml(C.ex_m)+'</div></div>';
  var saved=HCE.lsJ(MK,[]);
  if(saved.length)h+='<div class="card"><h3>Messaggi salvati</h3>'+saved.slice(0,10).map(function(x){var Cx=Z.combos.filter(function(c){return c.k===x.k})[0];return '<details class="ent"><summary><span class="L">'+esc(x.k.slice(0,2))+'</span><span><b>'+esc(x.obj||x.k)+'</b><small>'+esc(x.k)+(x.wn?' · '+esc(x.wn):'')+' · '+new Date(+x.id).toLocaleDateString('it-IT')+'</small></span><span class="chev">›</span></summary><div class="sb">'+(Cx?Cx.seq:[]).map(function(k){return x.f[k]?'<div><b>'+esc(BY[k].n)+'</b><p>'+esc(x.f[k])+'</p></div>':''}).join('')+'</div></details>'}).join('')+'</div>';
  $('v-combo').innerHTML=h}
$('v-combo').addEventListener('click',function(e){var b,t=e.target;
  if(b=t.closest('[data-ck]')){COMBO.k=b.dataset.ck;renderCombo();return}
  if(t.id==='c-save'){var C=Z.combos.filter(function(c){return c.k===COMBO.k})[0];if(!C.seq.some(function(k){return (COMBO.f[k]||'').trim()})){$('c-msg').innerHTML='<div class="note">Scrivi almeno una lettera.</div>';return}
    var who=people().filter(function(x){return x.id===COMBO.who})[0],a=HCE.lsJ(MK,[]);a.unshift({id:String(Date.now()),k:COMBO.k,who:COMBO.who,wn:who?who.n:'',obj:COMBO.obj,f:COMBO.f,u:Date.now()});HCE.lsPut(MK,a);
    COMBO.f={};COMBO.obj='';renderCombo();$('c-msg').innerHTML='<div class="msg">Salvato · +15 XP</div>'}});
$('v-combo').addEventListener('input',function(e){var t=e.target;if(t.dataset.cf)COMBO.f[t.dataset.cf]=t.value;if(t.id==='c-obj')COMBO.obj=t.value});
$('v-combo').addEventListener('change',function(e){if(e.target.id==='c-who'){COMBO.who=e.target.value;renderCombo()}});

/* ---------- REGOLE ---------- */
function renderRegole(){$('v-regole').innerHTML='<div class="card">'+Z.rules.map(function(r){return '<div style="display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--line2);padding-top:10px"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span>'+ml(r[2])+'</div>'}).join('')+'</div>'}

var R_={profilo:renderProfilo,combo:renderCombo,lista:renderLista,regole:renderRegole};
function show(t){document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t?'true':'false')});Object.keys(R_).forEach(function(x){$('v-'+x).hidden=x!==t});R_[t]();window.scrollTo(0,0)}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)show(b.dataset.t)});
var h0=(location.hash||'').slice(1);if(R_[h0])show(h0);else renderProfilo();
});
</script>

<style>
/* Tema "gioco": colori, caratteri arrotondati, pulsanti in rilievo. Caricato dopo gli stili di ogni pagina. */
:root{
 --bg:#F7F8FC;--surface:#FFFFFF;--sunk:#F1F3F9;--fg:#1B2240;--muted:#5A6385;--line:#E3E7F0;--line2:#EDF0F6;
 --accent:#2459E0;--accent-dk:#1B46B8;--accent-fg:#FFFFFF;--accent-soft:#EAF0FF;
 --star:#F5A524;--star-dk:#C98408;--star-soft:#FFF4DE;--warn:#C2410C;--warn-soft:#FFEDE3;
 --ok:#12805A;--ok-bg:#1FB37A;--ok-dk:#138A5C;--ok-soft:#E3F7EE;--fire:#FF8A3D;

html body,html body *:not(svg):not(svg *):not(code):not(pre){font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}

body{background:var(--bg);color:var(--fg);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
h1,h2,h3{font-weight:900!important;letter-spacing:-.01em}

/* schede */
.card,.hist,.mod,details.lv,.ig{border:2px solid var(--line)!important;border-radius:20px!important;box-shadow:var(--lift)!important}

/* pulsanti in rilievo */
.btn{border-radius:14px!important;font-weight:800!important;letter-spacing:.02em;border:2px solid var(--line)!important;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}

.btn:active,.chk:active,.star:active,.ch:active,.scale button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pri:active{box-shadow:0 1px 0 var(--accent-dk)}
.chk,.star{border:2px solid var(--line)!important;border-radius:14px!important;box-shadow:0 3px 0 var(--line)}
.chk[aria-pressed="true"]{background:var(--ok-bg)!important;border-color:var(--ok-bg)!important;color:#fff!important;box-shadow:0 3px 0 var(--ok-dk)}

.ch{border-radius:99px!important}
.scale button[aria-pressed="true"]{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-fg)!important;box-shadow:0 3px 0 var(--accent-dk)}

/* schede (tabs) */
.tabs,.seg{background:var(--sunk)!important;border-radius:16px!important;padding:5px!important}
.tab,.seg button{font-weight:800!important;border-radius:12px!important}
.tab[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent)!important;color:var(--accent-fg)!important;box-shadow:0 3px 0 var(--accent-dk)!important}

textarea,input[type=text],input[type=search],select{border:2px solid var(--line)!important;border-radius:14px!important;background:var(--sunk)!important;font-weight:600}
