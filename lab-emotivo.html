<style>
:root{--onp:#FFFFFF;--sl:#A32A5C;--sl-s:#FBE7EF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onp:#0B1020;--sl:#F59AC0;--sl-s:#3D1527}}
:root[data-theme="dark"]{--onp:#0B1020;--sl:#F59AC0;--sl-s:#3D1527}
*{box-sizing:border-box}
body{margin:0;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
p{margin:0}
header{padding-top:22px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sl);font-weight:900}
h1{font-size:1.9rem;line-height:1.1;margin:0}h2{font-size:1.3rem;margin:0}h3{font-size:1.05rem;margin:0}
.lead{color:var(--muted);font-weight:600}
nav.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;cursor:pointer;min-height:44px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.tip{font-size:.88rem;color:var(--muted);font-weight:600;line-height:1.45}
.note{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600;color:var(--muted);line-height:1.45}
.src{display:inline-flex;font-size:.8rem;font-weight:800;color:var(--accent);background:var(--sunk);border-radius:99px;padding:7px 12px;text-decoration:none;align-self:flex-start;min-height:36px;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.92rem}
textarea,input[type=text],select{width:100%;font:inherit;padding:10px 12px;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;font:inherit;cursor:pointer;background:var(--surface);color:var(--fg);min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.sl{background:var(--sl);color:var(--onp);border-color:var(--sl);font-weight:900}
.msg{border-radius:12px;padding:9px 12px;font-weight:800;font-size:.88rem;background:var(--ok-soft);color:var(--ok)}
.grp{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--sl);margin-top:6px}
.ent{border-radius:20px;border:2px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:0 3px 0 var(--line)}
.ent summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:62px}
.ent summary::-webkit-details-marker{display:none}
.ent .L{flex:none;width:46px;height:46px;border-radius:14px;background:var(--sl-s);color:var(--sl);display:grid;place-items:center;font-weight:900;font-size:1rem}
.ent summary b{font-weight:900;font-size:1.05rem;display:block}.ent summary small{display:block;color:var(--muted);font-weight:700;font-size:.84rem}
.ent .chev{margin-left:auto;color:var(--muted);transition:transform .15s;flex:none}.ent[open] .chev{transform:rotate(90deg)}
.sb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.face{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.face b{font-weight:900;color:var(--sl)}.face span{font-weight:600;line-height:1.4}.face ul{margin:0;padding-left:18px;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.45}
.say{background:var(--sunk);border-left:4px solid var(--sl);border-radius:10px;padding:10px 12px;font-weight:700;line-height:1.45}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:2px solid var(--line2);padding-top:10px}
.pr .nm b{font-weight:900}.pr .nm small{display:block;color:var(--muted);font-weight:700;font-size:.8rem;line-height:1.35}
.seg{display:flex;gap:4px}.seg button{font:inherit;font-weight:800;font-size:.84rem;padding:8px 10px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sl);border-color:var(--sl);color:var(--onp)}
@media (max-width:520px){.pr{grid-template-columns:minmax(0,1fr)}}
.item{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-weight:900}.item .tx span{font-size:.82rem;color:var(--muted);font-weight:700}
.adv{display:flex;flex-direction:column;gap:8px}.adv div{border-radius:12px;padding:10px 12px;background:var(--sunk);line-height:1.45;font-weight:600}.adv div b{font-weight:900}
.adv div.k{background:var(--sl-s)}
.step{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.step .h{display:flex;gap:10px;align-items:center}.step .h .L{flex:none;width:36px;height:36px;border-radius:11px;background:var(--sl);color:var(--onp);display:grid;place-items:center;font-weight:900}
.step .h b{font-weight:900}
.muted{color:var(--muted);font-size:.86rem;font-weight:600}
.notice{text-align:center;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font:inherit;font-weight:800;font-size:.86rem;padding:8px 12px;min-height:44px;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--fg);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--sl);border-color:var(--sl);color:var(--onp)}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:600;line-height:1.4;min-height:44px;padding:4px 0}.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--sl)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}table.t td,table.t th{text-align:left;padding:8px 6px;border-top:2px solid var(--line2);vertical-align:top;line-height:1.4}table.t th{font-weight:900}
.tw{overflow-x:auto}
.ex{font-style:italic;color:var(--fg);background:var(--sunk);border-radius:10px;padding:8px 12px;line-height:1.45;font-weight:600}
.ex:before{content:"Esempio · ";font-style:normal;font-weight:900;color:var(--sl);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.tk{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px;line-height:1.45}.tk>b{font-weight:900;font-size:1.02rem}
.lk{display:flex;gap:6px;flex-wrap:wrap}.lk a{font-size:.8rem;font-weight:800;text-decoration:none;border-radius:99px;padding:7px 11px;min-height:36px;display:inline-flex;align-items:center;background:var(--sunk);color:var(--fg)}
.lk a.w{background:var(--sl-s);color:var(--sl)}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.45;font-weight:600}
.qa{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.qa b{font-weight:900;line-height:1.4}.qa .an{background:var(--ok-soft);color:var(--fg);border-radius:10px;padding:8px 10px;font-weight:700;line-height:1.4}
.ent .L.d{background:var(--ok-soft);color:var(--ok)}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--sl);border-radius:99px}
.kpi{display:flex;gap:16px;flex-wrap:wrap;font-weight:800}.kpi span{color:var(--muted);font-weight:700}
.shelf{display:flex;gap:6px;flex-wrap:wrap}.shelf button{font:inherit;font-weight:800;font-size:.84rem;padding:8px 12px;min-height:44px;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--fg);cursor:pointer;text-align:left}
.shelf button[aria-pressed="true"]{background:var(--sl);border-color:var(--sl);color:var(--onp)}
.xx{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}.xx>b{font-weight:900}.xx .src2{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--sl)}
.cd2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cd2 div{border-radius:12px;padding:10px 12px;background:var(--sunk);line-height:1.45;font-weight:600}.cd2 div b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:900}.cd2 div.n{background:var(--sl-s)}
@media (max-width:520px){.cd2{grid-template-columns:minmax(0,1fr)}}
.mp{display:flex;flex-direction:column;gap:8px}.ma{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px}.ma>b{font-weight:900;font-size:1.02rem}.ma .rw{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:.88rem;line-height:1.4}.ma .rw>span:first-child{font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}.ma .none{color:var(--muted);font-weight:600}.ma .gap{color:var(--warn,#9a6400);font-weight:800}
.mk{display:flex;gap:16px;flex-wrap:wrap}.mk span{font-weight:700;color:var(--muted)}.mk b{font-weight:900;color:var(--fg)}
@media (max-width:420px){.ma .rw{grid-template-columns:minmax(0,1fr)}}
.rule{display:flex;flex-direction:column;gap:2px;line-height:1.45;font-weight:600;border-left:4px solid var(--sl);padding:2px 0 2px 10px}.rule small{color:var(--muted);font-weight:700;font-size:.78rem}
.ak{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:.9rem;line-height:1.45}.ak>span:nth-child(odd){font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
@media (max-width:420px){.ak{grid-template-columns:minmax(0,1fr)}}
.obs{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;line-height:1.45}.obs b{font-weight:900}.obs .m{color:var(--muted);font-size:.82rem;font-weight:700}
select{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;min-height:44px;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:12px}
</style>
<div class="page">
<header>
  <div class="eyebrow" id="eb">HCE · Laboratori</div>
  <h1 id="h1">Laboratorio</h1>
  <p class="lead" id="lead"></p>
</header>
<div class="card notice" id="old" hidden><h2>Serve il file dei contenuti aggiornato</h2><p class="muted">Importa la versione nuova di hce-contenuti.json dalla Home, in Impostazioni.</p><a class="btn pri" href="index.html#contenuti">Vai alla Home</a></div>
<div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
  <div class="card" id="kpi"></div>
  <nav class="tb"><div class="tabs"><button class="tab" data-t="argomenti" aria-selected="true">Argomenti</button><button class="tab" data-t="aspetti" aria-selected="false">Aspetti</button><button class="tab" data-t="osserva" aria-selected="false">Osserva</button></div></nav>
  <section id="v-argomenti"></section><section id="v-aspetti" hidden></section><section id="v-osserva" hidden></section>
</div>
</div>
<script>
HCE.ready(function(PACK){
var $=function(i){return document.getElementById(i)};
var LK='emo',LAB=(PACK.labs||[]).filter(function(x){return x.k===LK})[0];
if(!LAB||!PACK.lib){$('old').hidden=false;return}
$('app').hidden=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var SYS=(PACK.sys||{})[LAB.i]||'';$('eb').textContent='HCE · Intelligenza '+LAB.i.toLowerCase()+' · '+SYS;$('h1').textContent=LAB.emo+' '+LAB.n;$('lead').textContent=LAB.intro;
var K='lab_v1',OPEN={},CUR='argomenti',OBSASP='';
var TL={io:['io.html#emozioni','Io'],incontro:['incontro.html','Prima di un incontro'],mib:['mib.html','Matrice biochimica'],public:['public.html','Public speaking'],prep:['prep.html','Prepara'],leadership:['leadership.html','Leadership'],e3:['e3.html','Algoritmo E³'],slcc:['slcc.html','SLCC'],frame:['frame.html','Frame e metafore'],algoritmi:['algoritmi.html','Algoritmi linguistici'],vendita:['vendita.html','Vendita'],istair:['istair.html','I-STAIR'],feedback:['feedback.html','Feedback'],carisma:['carisma.html','Carisma SPARK'],protocollo:['protocollo.html','Protocollo D-P-I']};
var L=PACK.lib,BN={};L.spark.pillars.forEach(function(p){BN['spark-'+p.k]=['Incantali tutti',p.k+' · '+p.n]});L.ie.ch.forEach(function(c){BN['ie-'+c.n]=['Instant Emotions','cap. '+c.n+' · '+c.t]});L.ip.ch.forEach(function(c){BN['ip-'+c.n]=['Instant Persuasion','cap. '+c.n+' · '+c.t]});(L.more||[]).forEach(function(B){B.ch.forEach(function(c){BN[B.id+'-'+c.n]=[B.book,'cap. '+c.n+' · '+c.t]})});
var VD={};(PACK.vd||[]).forEach(function(v){if(v.i===LAB.i)VD[v.asp]=v});
function list(){return HCE.lsJ(K,[])}
function rec(id){return list().filter(function(x){return x.id===id})[0]||{id:id,lab:LK,kind:'ex'}}
function put(x){var a=list(),i=a.findIndex(function(y){return y.id===x.id});x.u=Date.now();if(i>=0)a[i]=x;else a.push(x);HCE.lsPut(K,a)}
function mine(){return list().filter(function(x){return x.lab===LK})}
function kpi(){var m=mine(),ex=m.reduce(function(s,x){return s+Object.keys(x.xd||{}).length},0),ob=m.filter(function(x){return x.kind==='obs'}).length,tot=LAB.topics.reduce(function(s,t){return s+t.exs.length},0);
  $('kpi').innerHTML='<div class="kpi">'+ex+'/'+tot+' <span>esercizi fatti</span> '+ob+' <span>osservazioni</span> '+Object.keys(VD).length+' <span>aspetti della ruota</span></div><div class="bar"><i style="width:'+Math.round(100*ex/Math.max(1,tot))+'%"></i></div><p class="note">Regole dal corso e dai libri, con la fonte accanto. ⚠ = sintesi o collocazione mia. Ogni esercizio dice se viene dal corso, da un libro o se l\'ho costruito io.</p>'}
function exs(t){var id=LK+'-'+t.k,r=rec(id),fs=r.fs||{},xd=r.xd||{};
  return '<span class="lbl">Esercizi</span>'+t.exs.map(function(x,i){return '<div class="xx"><span class="src2">'+(x.src==='corso'?'Dal corso':x.src==='libro'?'Dal libro':'Costruito da me')+'</span><b>'+esc(x.n)+'</b><span class="tip">'+esc(x.d)+'</span>'+HCE.sf(x.s,fs[i],id+'#'+i,'lb')+
    '<div class="row">'+(xd[i]?'<span class="msg">Fatto il '+new Date(xd[i]).toLocaleDateString('it-IT')+'</span><button class="btn" data-xun="'+id+'|'+i+'">Annulla</button>':'<button class="btn sl" data-xd="'+id+'|'+i+'">L\'ho fatto · +10 XP</button>')+'</div></div>'}).join('')}
function renderArg(){var h='';LAB.topics.forEach(function(t,ti){var id='t-'+t.k,r=rec(LK+'-'+t.k),done=Object.keys(r.xd||{}).length;
  h+='<details class="ent" id="'+id+'"'+(OPEN[id]?' open':'')+'><summary><span class="L'+(done&&done>=t.exs.length?' d':'')+'">'+(done&&done>=t.exs.length?'✓':(ti+1))+'</span><span class="tx"><b>'+esc(t.n)+'</b><small>'+t.rules.length+' regole · '+t.exs.length+' esercizi'+(done?' · '+done+(done===1?' fatto':' fatti'):'')+'</small></span><span class="chev">›</span></summary><div class="sb">'+
   '<p style="font-weight:600;line-height:1.5">'+esc(t.d)+'</p><span class="lbl">Le regole</span>'+t.rules.map(function(x){return '<div class="rule">'+esc(x[0])+'<small>'+esc(x[1])+'</small></div>'}).join('')+
   (t.ex&&t.ex.length?'<span class="lbl">Esempi</span>'+t.ex.map(function(e){return '<div class="ex">'+esc(e)+'</div>'}).join(''):'')+
   (t.books.length?'<span class="lbl">Nei libri</span><div class="lk">'+t.books.filter(function(b){return BN[b]}).map(function(b){return '<a href="libri.html#'+b+'">'+esc(BN[b][0])+' · '+esc(BN[b][1])+' →</a>'}).join('')+'</div>':'')+
   '<span class="lbl">Sulla ruota</span><div class="lk">'+t.asp.map(function(a){return '<a class="w" href="studio.html#a='+encodeURIComponent(a)+'">'+esc(a)+'</a>'}).join('')+'</div>'+
   (t.tools.length?'<span class="lbl">Usalo in</span><div class="lk">'+t.tools.filter(function(k){return TL[k]}).map(function(k){return '<a href="'+TL[k][0]+'">'+esc(TL[k][1])+' →</a>'}).join('')+'</div>':'')+
   exs(t)+'</div></details>'});
  $('v-argomenti').innerHTML=h}
function renderAsp(){var areas=[],h='<div class="card"><p class="tip">I 15 aspetti dell\'intelligenza '+esc(LAB.i.toLowerCase())+' ('+esc(SYS)+') come li descrive il corso: cosa osservare, come, i segnali, l\'errore da evitare e la fonte.</p></div>';
  Object.keys(VD).forEach(function(a){if(areas.indexOf(VD[a].area)<0)areas.push(VD[a].area)});
  areas.forEach(function(ar){var id='a-'+ar;h+='<details class="ent" id="'+id+'"'+(OPEN[id]?' open':'')+'><summary><span class="L">'+esc(ar[0])+'</span><span class="tx"><b>'+esc(ar)+'</b><small>'+esc((PACK.areas||{})[ar]||'')+'</small></span><span class="chev">›</span></summary><div class="sb">'+
   Object.keys(VD).filter(function(a){return VD[a].area===ar}).map(function(a){var v=VD[a],k=v.k||[];return '<div class="tk"><b>'+esc(a)+'</b><span class="muted">'+esc(v.cue)+'</span><div class="ak"><span>Cosa</span><span>'+esc(k[0]||'')+'</span><span>Come</span><span>'+esc(k[1]||'')+'</span><span>Segnali</span><span>'+esc(k[2]||'')+'</span><span>Da evitare</span><span>'+esc(k[3]||'')+'</span><span>Fonte</span><span>'+esc(k[4]||'')+'</span></div>'+
     ((v.t||[]).length?'<span class="lbl">Strumenti del corso</span><ul class="pts">'+v.t.map(function(t){return '<li><b>'+esc(t.n)+'</b> · '+esc(t.c)+'</li>'}).join('')+'</ul>':'')+
     '<div class="row"><button class="btn sl" data-obs="'+esc(a)+'">Osserva questo aspetto</button><a class="btn" href="studio.html#a='+encodeURIComponent(a)+'">Sulla ruota</a></div></div>'}).join('')+'</div></details>'});
  $('v-aspetti').innerHTML=h}
var OB={};
function renderObs(){var m=mine().filter(function(x){return x.kind==='obs'}).sort(function(a,b){return b.t-a.t}),v=OBSASP&&VD[OBSASP];
  var h='<div class="card"><h3>Una nuova osservazione</h3><p class="tip">Il decode: prima i fatti, senza giudizio; poi un\'ipotesi e come verificarla. Un solo segnale è un indizio, non una conclusione.</p>'+
   '<label class="f">Aspetto<select id="o-asp"><option value="">Scegli…</option>'+Object.keys(VD).map(function(a){return '<option value="'+esc(a)+'"'+(a===OBSASP?' selected':'')+'>'+esc(VD[a].area+' · '+a)+'</option>'}).join('')+'</select></label>'+
