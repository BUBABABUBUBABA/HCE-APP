<style>
:root{--onp:#FFFFFF;--sl:#1864AB;--sl-s:#E7F1FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onp:#0B1020;--sl:#74C0FC;--sl-s:#12283F}}
:root[data-theme="dark"]{--onp:#0B1020;--sl:#74C0FC;--sl-s:#12283F}
*{box-sizing:border-box}
body{margin:0;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
p{margin:0}
header{padding-top:22px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sl);font-weight:900}
h1{font-size:1.9rem;line-height:1.1;margin:0}h2{font-size:1.3rem;margin:0}h3{font-size:1.05rem;margin:0}
.lead{color:var(--muted);font-weight:600}
nav.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;cursor:pointer;min-height:44px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.tip{font-size:.88rem;color:var(--muted);font-weight:600;line-height:1.45}
.note{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600;color:var(--muted);line-height:1.45}
.src{display:inline-flex;font-size:.8rem;font-weight:800;color:var(--accent);background:var(--sunk);border-radius:99px;padding:7px 12px;text-decoration:none;align-self:flex-start;min-height:36px;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.92rem}
textarea,input[type=text],select{width:100%;font:inherit;padding:10px 12px;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;font:inherit;cursor:pointer;background:var(--surface);color:var(--fg);min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.sl{background:var(--sl);color:var(--onp);border-color:var(--sl);font-weight:900}
.msg{border-radius:12px;padding:9px 12px;font-weight:800;font-size:.88rem;background:var(--ok-soft);color:var(--ok)}
.grp{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--sl);margin-top:6px}
.ent{border-radius:20px;border:2px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:0 3px 0 var(--line)}
.ent summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:62px}
.ent summary::-webkit-details-marker{display:none}
.ent .L{flex:none;width:46px;height:46px;border-radius:14px;background:var(--sl-s);color:var(--sl);display:grid;place-items:center;font-weight:900;font-size:1rem}
.ent summary b{font-weight:900;font-size:1.05rem;display:block}.ent summary small{display:block;color:var(--muted);font-weight:700;font-size:.84rem}
.ent .chev{margin-left:auto;color:var(--muted);transition:transform .15s;flex:none}.ent[open] .chev{transform:rotate(90deg)}
.sb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.face{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.face b{font-weight:900;color:var(--sl)}.face span{font-weight:600;line-height:1.4}.face ul{margin:0;padding-left:18px;color:var(--muted);font-weight:600;font-size:.88rem;line-height:1.45}
.say{background:var(--sunk);border-left:4px solid var(--sl);border-radius:10px;padding:10px 12px;font-weight:700;line-height:1.45}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:2px solid var(--line2);padding-top:10px}
.pr .nm b{font-weight:900}.pr .nm small{display:block;color:var(--muted);font-weight:700;font-size:.8rem;line-height:1.35}
.seg{display:flex;gap:4px}.seg button{font:inherit;font-weight:800;font-size:.84rem;padding:8px 10px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sl);border-color:var(--sl);color:var(--onp)}
@media (max-width:520px){.pr{grid-template-columns:minmax(0,1fr)}}
.item{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-weight:900}.item .tx span{font-size:.82rem;color:var(--muted);font-weight:700}
.adv{display:flex;flex-direction:column;gap:8px}.adv div{border-radius:12px;padding:10px 12px;background:var(--sunk);line-height:1.45;font-weight:600}.adv div b{font-weight:900}
.adv div.k{background:var(--sl-s)}
.step{border-top:2px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.step .h{display:flex;gap:10px;align-items:center}.step .h .L{flex:none;width:36px;height:36px;border-radius:11px;background:var(--sl);color:var(--onp);display:grid;place-items:center;font-weight:900}
.step .h b{font-weight:900}
.muted{color:var(--muted);font-size:.86rem;font-weight:600}
.notice{text-align:center;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{font:inherit;font-weight:800;font-size:.86rem;padding:8px 12px;min-height:44px;border:2px solid var(--line);border-radius:99px;background:var(--surface);color:var(--fg);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--sl);border-color:var(--sl);color:var(--onp)}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:600;line-height:1.4;min-height:44px;padding:4px 0}.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--sl)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}table.t td,table.t th{text-align:left;padding:8px 6px;border-top:2px solid var(--line2);vertical-align:top;line-height:1.4}table.t th{font-weight:900}
.tw{overflow-x:auto}
</style>
<div class="page">
<header>
  <div class="eyebrow">HCE · Algoritmi linguistici</div>
  <h1>Algoritmi linguistici</h1>
  <p class="lead">Componi un messaggio in tre fasi, Engage, Explain, Exchange, con almeno uno strumento per fase.</p>
</header>
<div class="card notice" id="old" hidden><h2>Serve il file dei contenuti aggiornato</h2><p class="muted">Importa la versione nuova di hce-contenuti.json dalla Home, in Impostazioni.</p><a class="btn pri" href="index.html#contenuti">Vai alla Home</a></div>
<div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
  <nav class="tb"><div class="tabs"><button class="tab" data-t="componi" aria-selected="true">Componi</button><button class="tab" data-t="strumenti" aria-selected="false">I 9 strumenti</button><button class="tab" data-t="esempi" aria-selected="false">Esempi</button></div></nav>
  <section id="v-componi"></section><section id="v-strumenti" hidden></section><section id="v-esempi" hidden></section>
</div>
</div>
<script>
HCE.ready(function(PACK){
var $=function(i){return document.getElementById(i)};
if(!PACK.lal){$('old').hidden=false;return}
$('app').hidden=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var MODT={};PACK.data.mods.forEach(function(m){MODT[m.id]=m.t});
function ml(id){return id?'<a class="src" href="studio.html#m='+id+'">↗ '+esc(MODT[id]||id)+'</a>':''}
function list(){return HCE.lsJ(K,[])}
function put(x){var a=list(),i=a.findIndex(function(y){return y.id===x.id});x.u=Date.now();if(i>=0)a[i]=x;else a.unshift(x);HCE.lsPut(K,a)}
function fld(lab,key,val,ph,sub){return '<label class="f">'+esc(lab)+(sub?'<span class="muted">'+esc(sub)+'</span>':'')+'<textarea data-f="'+key+'" placeholder="'+esc(ph||'')+'" aria-label="'+esc(lab)+'">'+esc(val||'')+'</textarea></label>'}
function show(t){document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t?'true':'false')});Object.keys(R_).forEach(function(x){$('v-'+x).hidden=x!==t});R_[t]();window.scrollTo(0,0)}
function setF(o,f,v){var p=f.split('.');if(p.length>1){o[p[0]]=o[p[0]]||{};o[p[0]][p[1]]=v}else o[f]=v}
function saved(v,rend,msgNew,msgUpd){return function(){var fresh=!CUR.id;if(fresh)CUR.id=String(Date.now());if((CUR.esito||'').trim()&&!CUR.et)CUR.et=Date.now();if(!(CUR.esito||'').trim())delete CUR.et;put(CUR);rend();$('i-msg').innerHTML='<div class="msg">'+(fresh?msgNew:msgUpd)+'</div>'}}
function oldList(lab,line){var old=list();if(!old.length||CUR.id)return '';return '<div class="card"><span class="lbl">'+lab+'</span>'+old.slice(0,10).map(function(x){return '<div class="item"><div class="tx"><b>'+esc(line(x)[0]||'Senza titolo')+'</b><span>'+esc(line(x)[1]||'')+(x.esito?' · fatto':'')+'</span></div><button class="btn" data-open="'+x.id+'">Apri</button></div>'}).join('')+'</div>'}
function saveRow(lab,nw){return '<div class="row stick"><button class="btn sl" id="i-save">'+(CUR.id?'Aggiorna':lab)+'</button>'+(CUR.id?'<button class="btn" id="i-new">'+nw+'</button><button class="btn" id="i-del">Elimina</button>':'')+'</div><div id="i-msg"></div>'}
function common(view,rend,blank,keys,save){$(view).addEventListener('input',function(e){var f=e.target.dataset.f;if(f)setF(CUR,f,e.target.value)});
 $(view).addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.open){CUR=JSON.parse(JSON.stringify(list().filter(function(x){return x.id===t.dataset.open})[0]||blank()));keys.forEach(function(k){CUR[k]=CUR[k]||{}});rend();window.scrollTo(0,0);return}
  if(t.id==='i-new'){CUR=blank();rend();window.scrollTo(0,0);return}
  if(t.id==='i-del'){if(t.textContent!=='Elimina?'){t.textContent='Elimina?';return}HCE.lsPut(K,list().filter(function(x){return x.id!==CUR.id}));CUR=blank();rend();return}
  if(t.id==='i-save'){save();return}})}
var Z=PACK.lal.alg,K='alg_v1',TN={};Z.phases.forEach(function(p){p.tools.forEach(function(t){TN[t.k]=t})});
function blank(){return {id:'',obj:'',sw:'',mz:'',sel:{},txt:{},esito:''}}
var CUR=blank();
function chosen(p){return p.tools.filter(function(t){return CUR.sel[t.k]})}
function prevHtml(){var ok=Z.phases.every(function(p){return chosen(p).length}),full=Z.phases.map(function(p){return chosen(p).map(function(t){return (CUR.txt[t.k]||'').trim()}).filter(Boolean).join(' ')}).filter(Boolean).join('\n\n');
  return '<span class="lbl">Il messaggio completo</span>'+(ok?'<p class="muted">Algoritmo: '+Z.phases.map(function(p){return chosen(p).map(function(t){return t.n}).join(' + ')}).join(' → ')+'</p>':'<p class="tip">'+esc(Z.rule)+'</p>')+
    (full?'<div class="say" style="white-space:pre-wrap">'+esc(full)+'</div><div class="row"><button class="btn" id="a-copy">Copia il messaggio</button></div>':'<p class="muted">Scrivi le frasi: qui le vedi in ordine.</p>')+ml(Z.rule_m)}
function renderComp(){var h=oldList('I tuoi messaggi',function(x){return [x.obj,x.mz]});
  h+='<div class="card"><span class="lbl">Prima di scrivere</span><p class="tip">'+esc(Z.intro)+'</p>'+ml(Z.intro_m)+fld(Z.before[0],'obj',CUR.obj,'Es. che il cliente fissi una demo')+fld(Z.before[1],'sw',CUR.sw,'Cosa offro in cambio')+ml(Z.before_m)+
    '<span class="lbl">Il mezzo</span><div class="chips">'+Z.media.map(function(m){return '<button data-mz="'+m+'" aria-pressed="'+(CUR.mz===m)+'">'+m+'</button>'}).join('')+'</div></div>';
  Z.phases.forEach(function(p,i){var c=chosen(p);
    h+='<div class="card"><span class="lbl">'+(i+1)+' · '+esc(p.n)+(c.length?'':' · scegli almeno uno strumento')+'</span><p class="tip">'+esc(p.goal)+'</p>'+ml(p.m)+'<div class="chips">'+p.tools.map(function(t){return '<button data-tl="'+t.k+'" aria-pressed="'+!!CUR.sel[t.k]+'">'+esc(t.n)+'</button>'}).join('')+'</div>'+
    c.map(function(t){return '<div class="step"><b>'+esc(t.n)+'</b><span>'+esc(t.d)+'</span><span class="muted">'+esc(t.ex)+'</span>'+ml(t.m)+'</div>'+fld('La tua frase · '+t.n,'txt.'+t.k,CUR.txt[t.k],'')}).join('')+'</div>'});
  h+='<div class="card" id="a-prev">'+prevHtml()+'</div>';

  if(CUR.id)h+='<div class="card"><span class="lbl">Dopo · com\'è andata</span>'+fld('La risposta, cosa cambierei','esito',CUR.esito,'+10 XP')+'</div>';
  h+=saveRow('Salva il messaggio · +20 XP','Nuovo');
  $('v-componi').innerHTML=h}
$('v-componi').addEventListener('input',function(e){var f=e.target.dataset.f;if(f&&f.indexOf('txt.')===0){setF(CUR,f,e.target.value);$('a-prev').innerHTML=prevHtml()}});
common('v-componi',renderComp,blank,['sel','txt'],function(){if(!Z.phases.every(function(p){return chosen(p).length})){$('i-msg').innerHTML='<div class="msg">Serve almeno uno strumento per ogni fase.</div>';return}saved(0,renderComp,'Messaggio salvato · +20 XP','Messaggio aggiornato')()});
$('v-componi').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.tl){CUR.sel[t.dataset.tl]=!CUR.sel[t.dataset.tl];renderComp()}else if(t.dataset.mz){CUR.mz=CUR.mz===t.dataset.mz?'':t.dataset.mz;renderComp()}
  else if(t.id==='a-copy'){var s=document.querySelector('#v-componi .say').textContent;try{navigator.clipboard.writeText(s).then(function(){t.textContent='Copiato ✓'},function(){t.textContent='Selezionalo e copialo'})}catch(x){t.textContent='Selezionalo e copialo'}}});
function renderTools(){$('v-strumenti').innerHTML='<div class="card"><p class="tip">'+esc(Z.rule)+'</p><div class="note">'+esc(Z.e3note)+'</div><div class="note">'+esc(Z.combos)+'</div>'+ml(Z.rule_m)+'</div>'+Z.phases.map(function(p){return '<div class="card"><h3>'+esc(p.n)+'</h3><span>'+esc(p.goal)+'</span>'+ml(p.m)+p.tools.map(function(t){return '<div class="step"><b>'+esc(t.n)+'</b><span>'+esc(t.d)+'</span><span class="muted">'+esc(t.ex)+'</span>'+ml(t.m)+'</div>'}).join('')+'</div>'}).join('')+'<div class="card"><h3>La chimica delle tre fasi</h3><span>'+esc(Z.chem)+'</span>'+ml(Z.chem_m)+'</div>'}
function renderEx(){$('v-esempi').innerHTML=Z.examples.map(function(x,i){return '<div class="card"><h3>'+esc(x.n)+'</h3><span>'+x.seq.map(function(s){return s.map(function(k){return esc(TN[k].n)}).join(' + ')}).join(' → ')+'</span><span>'+esc(x.note)+'</span>'+ml(x.m)+'<div class="row"><button class="btn sl" data-use="'+i+'">Usalo come traccia</button></div></div>'}).join('')}
$('v-esempi').addEventListener('click',function(e){var b=e.target.closest('[data-use]');if(!b)return;var x=Z.examples[+b.dataset.use];CUR=blank();x.seq.forEach(function(s){s.forEach(function(k){CUR.sel[k]=true})});show('componi')});
var R_={componi:renderComp,strumenti:renderTools,esempi:renderEx};

document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)show(b.dataset.t)});
var h0=(location.hash||'').slice(1);if(R_[h0])show(h0);else R_[Object.keys(R_)[0]]();
});
</script>

<style>

 --bg:#F7F8FC;--surface:#FFFFFF;--sunk:#F1F3F9;--fg:#1B2240;--muted:#5A6385;--line:#E3E7F0;--line2:#EDF0F6;

 --ok:#4FD69C;--ok-bg:#2FBF83;--ok-dk:#1B7F56;--ok-soft:#14352A;--fire:#FF9D5C;
 --c1:#7EA2FF;--c2:#4FD69C;--c3:#FFC247;--c4:#B69CFF;--c5:#FF8A80;
 --d:#7EA2FF;--d-soft:#1D2A52;--p:#B69CFF;--p-soft:#2A2350;--i:#FF9B6A;--i-soft:#3B2318;
 --shadow:none;--lift:0 3px 0 var(--line);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F1426;--surface:#182038;--sunk:#131A30;--fg:#EEF1FA;--muted:#A3ACC9;--line:#2A3459;--line2:#222B4A;
 --accent:#6F97FF;--accent-dk:#3F66D6;--accent-fg:#0B1020;--accent-soft:#1D2A52;
 --star:#FFC247;--star-dk:#B88310;--star-soft:#3A2F14;--warn:#FF9B6A;--warn-soft:#3B2318;
 --ok:#4FD69C;--ok-bg:#2FBF83;--ok-dk:#1B7F56;--ok-soft:#14352A;--fire:#FF9D5C;
 --c1:#7EA2FF;--c2:#4FD69C;--c3:#FFC247;--c4:#B69CFF;--c5:#FF8A80;
 --d:#7EA2FF;--d-soft:#1D2A52;--p:#B69CFF;--p-soft:#2A2350;--i:#FF9B6A;--i-soft:#3B2318;

html body,html body *:not(svg):not(svg *):not(code):not(pre){font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
html body svg text{font-family:Nunito,system-ui,sans-serif!important}
body{background:var(--bg);color:var(--fg);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
h1,h2,h3{font-weight:900!important;letter-spacing:-.01em}
h1{font-size:1.9rem}
.eyebrow,.ph,.area{font-weight:800!important}

/* schede */
.card,.hist,.mod,details.lv,.ig{border:2px solid var(--line)!important;border-radius:20px!important;box-shadow:var(--lift)!important}
.mod.done{background:var(--ok-soft)!important;border-color:var(--ok-bg)!important;box-shadow:0 3px 0 var(--ok-bg)!important}

/* pulsanti in rilievo */
.btn{border-radius:14px!important;font-weight:800!important;letter-spacing:.02em;border:2px solid var(--line)!important;box-shadow:0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.btn.pri,.dpi .btn:not(.sec):not(.on){background:var(--accent)!important;color:var(--accent-fg)!important;border-color:var(--accent)!important;box-shadow:0 4px 0 var(--accent-dk)}
.btn:active,.chk:active,.star:active,.ch:active,.scale button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pri:active{box-shadow:0 1px 0 var(--accent-dk)}
.chk,.star{border:2px solid var(--line)!important;border-radius:14px!important;box-shadow:0 3px 0 var(--line)}
.chk[aria-pressed="true"]{background:var(--ok-bg)!important;border-color:var(--ok-bg)!important;color:#fff!important;box-shadow:0 3px 0 var(--ok-dk)}
.star[aria-pressed="true"]{background:var(--star)!important;border-color:var(--star)!important;box-shadow:0 3px 0 var(--star-dk)}
.scale button,.ch{border:2px solid var(--line)!important;border-radius:14px!important;font-weight:800!important;box-shadow:0 3px 0 var(--line)}
.ch{border-radius:99px!important}
.scale button[aria-pressed="true"]{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-fg)!important;box-shadow:0 3px 0 var(--accent-dk)}

/* schede (tabs) */
.tabs,.seg{background:var(--sunk)!important;border-radius:16px!important;padding:5px!important}
.tab,.seg button{font-weight:800!important;border-radius:12px!important}
.tab[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--accent)!important;color:var(--accent-fg)!important;box-shadow:0 3px 0 var(--accent-dk)!important}

/* campi */
textarea,input[type=text],input[type=search],select{border:2px solid var(--line)!important;border-radius:14px!important;background:var(--sunk)!important;font-weight:600}
textarea:focus,input:focus,select:focus{outline:none!important;border-color:var(--accent)!important}
.pill,.tag{font-weight:800!important}
.bar{height:10px!important;border-radius:99px}.bar i{background:var(--ok-bg)!important;border-radius:99px}

/* barra di navigazione in basso */
.appbar{position:fixed!important;left:0;right:0;bottom:0;top:auto!important;z-index:15;max-width:none!important;margin:0!important;display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px!important;
 background:var(--surface);border-top:2px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))!important}
.appbar a{display:flex!important;flex-direction:column;align-items:center;gap:2px;padding:6px 0!important;border-radius:14px!important;font-weight:800!important;font-size:.76rem!important;color:var(--muted)!important;background:none!important;max-width:160px;width:100%;justify-self:center}
.appbar a svg{width:26px;height:26px}
.appbar a[aria-current]{color:var(--accent)!important;background:var(--accent-soft)!important}

/* ---------- Accessibilità: contrasto, dimensioni minime del testo e dei pulsanti ---------- */
:root{--q-orange:#C2410C;--q-teal:#0B7C87;--q-blue:#2459E0;--q-pink:#C2255C;--q-green:#237A36;--q-purple:#7C3AED;--q-red:#C92A2A;--q-amber:#9A6400;--q-gray:#495057;--q-violet:#862E9C;--q-sky:#1971C2;--q-on:#FFFFFF;--xp-fg:#8A5A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--q-orange:#FFA94D;--q-teal:#5FD3DE;--q-blue:#8AAEFF;--q-pink:#FF8FB3;--q-green:#7EDC8F;--q-purple:#B69CFF;--q-red:#FF8787;--q-amber:#FFC247;--q-gray:#C1C7D0;--q-violet:#E0A3F5;--q-sky:#74C0FC;--q-on:#0B1020;--xp-fg:#FFC247}}
:root[data-theme="dark"]{--q-orange:#FFA94D;--q-teal:#5FD3DE;--q-blue:#8AAEFF;--q-pink:#FF8FB3;--q-green:#7EDC8F;--q-purple:#B69CFF;--q-red:#FF8787;--q-amber:#FFC247;--q-gray:#C1C7D0;--q-violet:#E0A3F5;--q-sky:#74C0FC;--q-on:#0B1020;--xp-fg:#FFC247}
html body .cnt .xp{color:var(--xp-fg)!important}
.pill,.tag,.eyebrow,.lbl,.an,.area,.sy,.pl,.ph-tag,.crumb,body.studio div.ph,.mx th,.bub small,.sub small,.grp,.qtp,.rxh{font-size:.75rem!important}
.src{min-height:36px;padding:7px 12px!important;align-items:center;font-size:.8rem!important}
.ch,.fb{min-height:44px}
a.chip,.lnk{display:inline-flex!important;align-items:center;min-height:36px}
input[type=range]{min-height:32px}
.dbt button,.mx td button{min-height:38px}
:focus-visible{outline:3px solid var(--accent)!important;outline-offset:2px}
.appbar a{font-size:clamp(12px,3.3vw,max(12px,.76rem))!important;white-space:nowrap}
.tabs{overflow-x:auto;scrollbar-width:none;max-width:100%}.tabs::-webkit-scrollbar{display:none}.tabs .tab{flex-shrink:0}
.ph>div{min-width:0}.ph h3,.ph small{overflow-wrap:anywhere}
@media (max-width:979px){.mgrid{grid-template-columns:minmax(0,1fr)!important}}
.mgrid>*{min-width:0}.stats,#kn{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.mgrid>*{margin-left:0!important;margin-right:0!important;width:auto;max-width:100%}
select,input[type=text],input[type=search]{min-width:0;max-width:100%}
.wrap .wrap{margin-left:0!important;margin-right:0!important;align-self:stretch;min-width:0}
.wrap .wrap summary{flex-wrap:wrap}.wrap .wrap summary>*{min-width:0}

/* pulsanti comodi anche per dita grandi e mani meno ferme */
button,.btn,a.btn,label.btn,summary,select,input[type=text],input[type=search],input[type=date],.appbar a{min-height:44px}
button:not(.st):not(.tl):not(.tick){min-width:44px}
.mx td button{min-height:44px}
.row.stick{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);padding:8px 0;border-top:2px solid var(--line2)}
.mc,.opts button,.chips button,.ch{min-height:44px!important}
</style>
</body></html>
