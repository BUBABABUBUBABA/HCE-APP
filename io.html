<style>
:root{--onp:#FFFFFF;--io:#7048E8;--io-s:#EFE9FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onp:#0B1020;--io:#B4A0FF;--io-s:#261C47}}
:root[data-theme="dark"]{--onp:#0B1020;--io:#B4A0FF;--io-s:#261C47}
*{box-sizing:border-box}
body{margin:0;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
p{margin:0}
header{padding-top:22px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--io);font-weight:900}
h1{font-size:1.9rem;line-height:1.1;margin:0}h2{font-size:1.3rem;margin:0}h3{font-size:1.05rem;margin:0}
.lead{color:var(--muted);font-weight:600}
nav.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.88rem;cursor:pointer;min-height:44px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.tip{font-size:.84rem;color:var(--muted);font-weight:600;line-height:1.45}
.note{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:.88rem;font-weight:600;color:var(--muted);line-height:1.45}
.src{display:inline-flex;font-size:.74rem;font-weight:800;color:var(--accent);background:var(--sunk);border-radius:99px;padding:3px 9px;text-decoration:none;align-self:flex-start}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:.92rem}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;font:inherit;padding:10px 12px;color:var(--fg)}
textarea{min-height:60px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font:inherit;font-weight:800;font-size:.86rem;cursor:pointer;min-height:40px}
.ch[aria-pressed="true"]{background:var(--io);border-color:var(--io);color:var(--onp)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 16px;font:inherit;cursor:pointer;background:var(--surface);color:var(--fg);min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.io{background:var(--io);color:var(--onp);border-color:var(--io);font-weight:900}
.msg{border-radius:12px;padding:9px 12px;font-weight:800;font-size:.88rem;background:var(--ok-soft);color:var(--ok)}
.hero{border-radius:22px;padding:16px;background:var(--io);color:var(--onp);display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.hero b{font-size:1.3rem;font-weight:900}.hero .st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero .st div{background:rgba(0,0,0,.2);border-radius:14px;padding:8px;text-align:center}.hero .st b{display:block;font-size:1.3rem}.hero .st span{font-size:.74rem;font-weight:800}
.item{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface)}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-weight:900;overflow-wrap:anywhere}.item .tx span{font-size:.8rem;color:var(--muted);font-weight:700}
.tick{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:900;font-size:1.2rem;cursor:pointer}
.tick[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok-bg);color:#fff}
.ph{border-radius:20px;border:2px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:0 3px 0 var(--line)}
.ph summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:62px}
.ph summary::-webkit-details-marker{display:none}
.ph .L{flex:none;width:44px;height:44px;border-radius:14px;background:var(--io-s);color:var(--io);display:grid;place-items:center;font-weight:900;font-size:1.2rem}
.ph.dn .L{background:var(--ok-bg);color:#fff}
.ph summary b{font-weight:900;font-size:1.05rem;display:block}.ph summary small{display:block;color:var(--muted);font-weight:700;font-size:.82rem}
.ph .chev{margin-left:auto;color:var(--muted);transition:transform .15s;flex:none}.ph[open] .chev{transform:rotate(90deg)}
.pb{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.tool{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line2);padding-top:10px}.tool b{font-weight:900}
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--io);border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{border-radius:12px;background:var(--sunk);padding:6px 2px;text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.week div b{font-size:1rem;color:var(--fg)}.week div.on{background:var(--io-s)}
.timer{font-size:4rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;color:var(--io);line-height:1}
.steps{display:flex;flex-direction:column;gap:8px}
.stp{display:flex;gap:10px;align-items:flex-start;line-height:1.45}.stp b{flex:none;width:28px;height:28px;border-radius:9px;background:var(--io-s);color:var(--io);display:grid;place-items:center;font-weight:900;font-size:.85rem}
.stp span{min-width:0}.stp span strong{font-weight:900}
.qs{display:flex;flex-direction:column;gap:6px}.qs span{background:var(--sunk);border-left:4px solid var(--io);border-radius:10px;padding:8px 12px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--io)}
.muted{color:var(--muted);font-size:.86rem;font-weight:600}
.notice{text-align:center;align-items:center}
</style>
<div class="page">
<header>
  <div class="eyebrow">HCE · Improve · Inside</div>
  <h1>Io</h1>
  <p class="lead">Gli strumenti del corso usati su di te: stato, obiettivi, abitudini, focus, emozioni e bias. Tutto resta su questo dispositivo.</p>
</header>
<div class="card notice" id="old" hidden><h2>Serve il file dei contenuti aggiornato</h2><p class="muted">Importa la versione nuova di hce-contenuti.json dalla Home, in Impostazioni.</p><a class="btn pri" href="index.html#contenuti">Vai alla Home</a></div>
<div id="app" hidden style="display:flex;flex-direction:column;gap:16px">
  <nav class="tb"><div class="tabs">
    <button class="tab" data-t="oggi" aria-selected="true">Oggi</button>
    <button class="tab" data-t="obiettivi" aria-selected="false">Obiettivi</button>
    <button class="tab" data-t="abitudini" aria-selected="false">Abitudini</button>
    <button class="tab" data-t="focus" aria-selected="false">Focus</button>
    <button class="tab" data-t="emozioni" aria-selected="false">Emozioni</button>
    <button class="tab" data-t="bias" aria-selected="false">Bias</button>
    <button class="tab" data-t="settimana" aria-selected="false">Settimana</button>
  </div></nav>
  <section id="v-oggi"></section>
  <section id="v-obiettivi" hidden></section>
  <section id="v-abitudini" hidden></section>
  <section id="v-focus" hidden></section>
  <section id="v-emozioni" hidden></section>
  <section id="v-bias" hidden></section>
  <section id="v-settimana" hidden></section>
</div>
</div>
<script>
HCE.ready(function(PACK){
var Z=PACK.io,MB=PACK.mib,$=function(i){return document.getElementById(i)};
if(!Z||!MB){$('old').hidden=false;return}
$('app').hidden=false;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var MODT={},LV={};PACK.data.mods.forEach(function(m){MODT[m.id]=m.t});PACK.data.levels.forEach(function(l){LV[l.k]=l.n});
function ml(id){return id?'<a class="src" href="studio.html#m='+id+'">↗ '+esc(LV[id.slice(0,2)]||'')+' '+id.slice(2)+' · '+esc(MODT[id]||'')+'</a>':''}
function G(k,d){return HCE.lsJ(k,d)}function P(k,v){HCE.lsPut(k,v)}
var today=HCE.dayKey(Date.now());
function dk(off){var d=new Date();d.setDate(d.getDate()+off);return HCE.dayKey(d.getTime())}
function dShort(k){var d=new Date(k+'T12:00:00');return d.toLocaleDateString('it-IT',{weekday:'short'}).slice(0,3)}
function flash(id,t){var e=$(id);if(e)e.innerHTML='<div class="msg">'+esc(t)+'</div>'}
function newId(){return String(Date.now())}
var MX=MB.mix;

/* ---------- OGGI ---------- */
var CK=null;
function ckGet(){var a=G('io_check_v1',{});return a[today]?JSON.parse(JSON.stringify(a[today])):{now:'',need:'',help:'',emo:'',int:5,body:'',en:'',note:''}}
function habitsActive(){return G('io_habits_v1',[]).filter(function(h){return !h.arch})}
function streakOf(h){var n=0,d=new Date();if(!(h.log||{})[HCE.dayKey(d.getTime())])d.setDate(d.getDate()-1);while((h.log||{})[HCE.dayKey(d.getTime())]){n++;d.setDate(d.getDate()-1)}return n}
function renderOggi(){if(!CK)CK=ckGet();var C=Z.check,all=G('io_check_v1',{}),hs=habitsActive(),fs=G('io_focus_v1',[]);
  var hd=hs.filter(function(h){return (h.log||{})[today]}).length,fm=fs.filter(function(x){return HCE.dayKey(+x.id)===today}).reduce(function(a,x){return a+(x.min||0)},0);
  var h='<div class="hero"><b>'+new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+'</b><div class="st"><div><b>'+(all[today]?'✓':'—')+'</b><span>check-in</span></div><div><b>'+hd+'/'+hs.length+'</b><span>abitudini</span></div><div><b>'+fm+'′</b><span>focus</span></div></div></div>';
  // check-in
  h+='<div class="card"><h3>Check-in</h3><p class="tip">'+esc(C.intro)+'</p>'+
   '<div class="lbl">In che mix sono adesso?</div><div class="chips">'+MX.map(function(m,i){return '<button class="ch" data-ck="now" data-v="'+i+'" aria-pressed="'+(String(CK.now)===String(i))+'">'+esc(m.n)+'</button>'}).join('')+'</div>'+
   (CK.now!==''&&MX[CK.now]?'<p class="tip"><b>'+esc(MX[CK.now].n)+'</b>'+(MX[CK.now].levels&&MX[CK.now].levels.length?' ('+esc(MX[CK.now].levels.join(' → '))+')':'')+': salgono '+esc(MX[CK.now].plus.join(' e '))+'.</p>':'<p class="tip">Non sai cosa sono i mix? Sono i 7 stati della matrice IBM: li trovi spiegati in Strumenti.</p>')+
   '<div class="lbl">Di che mix ho bisogno oggi?</div><div class="chips">'+MX.map(function(m,i){return '<button class="ch" data-ck="need" data-v="'+i+'" aria-pressed="'+(String(CK.need)===String(i))+'">'+esc(m.n)+'</button>'}).join('')+'</div>'+
   (CK.need!==''&&MX[CK.need]&&MX[CK.need].use&&MX[CK.need].use[0]?'<p class="tip"><b>'+esc(MX[CK.need].n)+'</b> serve: '+esc(MX[CK.need].use[0].charAt(0).toLowerCase()+MX[CK.need].use[0].slice(1))+'</p>':'')+
   (CK.now!==''&&CK.need!==''&&CK.now!==CK.need?'<a class="src" href="mib.html#m='+CK.now+','+CK.need+'">↗ Matrice IBM: da '+esc(MX[CK.now].n)+' a '+esc(MX[CK.need].n)+'</a>':'')+
   '<div class="lbl">Questo stato mi aiuta?</div><div class="chips">'+[['si','Sì'],['parte','In parte'],['no','No']].map(function(o){return '<button class="ch" data-ck="help" data-v="'+o[0]+'" aria-pressed="'+(CK.help===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'+
   '<label class="f">Cosa provo, con la parola più precisa che trovo<input type="text" data-ckt="emo" value="'+esc(CK.emo)+'" placeholder="Es. impaziente, sollevato, inquieto"></label><p class="tip">'+esc(C.emo_tip)+'</p>'+
   '<label class="f"><span>Intensità: <b id="ck-int">'+CK.int+'</b>/10</span><input type="range" min="0" max="10" step="1" data-ckt="int" value="'+CK.int+'"></label>'+
   '<label class="f">Dove lo sento nel corpo<input type="text" data-ckt="body" value="'+esc(CK.body)+'" placeholder="Es. spalle rigide, respiro corto"></label><p class="tip">'+esc(C.int_tip)+'</p>'+
   '<div class="lbl">Energia</div><div class="chips">'+[['+','+ alta'],['=','= media'],['-','− bassa']].map(function(o){return '<button class="ch" data-ck="en" data-v="'+o[0]+'" aria-pressed="'+(CK.en===o[0])+'">'+o[1]+'</button>'}).join('')+'</div><p class="tip">'+esc(C.en_tip)+'</p>'+
   '<label class="f">Nota (facoltativa)<textarea data-ckt="note" placeholder="Cosa mi serve oggi per stare nel mix giusto?">'+esc(CK.note)+'</textarea></label>'+
   '<div class="row"><button class="btn io" id="ck-save">'+(all[today]?'Aggiorna':'Salva il check-in')+'</button></div><div id="ck-msg"></div>'+
   '<a class="src" href="mib.html">↗ Matrice IBM</a></div>';
  // ultimi 7 giorni
  h+='<div class="card"><h3>Ultimi 7 giorni</h3><div class="week">'+[-6,-5,-4,-3,-2,-1,0].map(function(o){var k=dk(o),c=all[k];return '<div class="'+(c?'on':'')+'"><span>'+dShort(k)+'</span><b>'+(c?(c.en==='+'?'+':c.en==='-'?'−':c.en?'=':'✓'):'·')+'</b><span>'+(c&&c.now!==''&&MX[c.now]?esc(MX[c.now].n.slice(0,4)):'')+'</span></div>'}).join('')+'</div><p class="tip">Energia (+ = −) e mix del giorno.</p></div>';
  // abitudini di oggi
  if(hs.length)h+='<div class="card"><h3>Abitudini di oggi</h3>'+hs.map(function(x){return habitRow(x)}).join('')+'</div>';
  h+='<div class="card"><h3>Anche su di te</h3><div class="row"><a class="btn" href="protocollo.html">Protocollo D-P-I</a><a class="btn" href="palestra.html">Palestra</a><a class="btn" href="dizionario.html#mie">Le mie espressioni</a></div></div>';
  $('v-oggi').innerHTML=h}
$('v-oggi').addEventListener('click',function(e){var b,t=e.target;
  if(b=t.closest('[data-ck]')){var k=b.dataset.ck,v=b.dataset.v;if(k==='now'||k==='need')v=+v;CK[k]=(CK[k]===v?'':v);renderOggi();return}
  if(t.id==='ck-save'){var a=G('io_check_v1',{}),first=!a[today];CK.t=(a[today]&&a[today].t)||Date.now();CK.u=Date.now();a[today]=CK;P('io_check_v1',a);CK=null;renderOggi();flash('ck-msg',first?'Check-in salvato · +10 XP':'Aggiornato');return}
  if(b=t.closest('[data-tick]'))tickHabit(b.dataset.tick)});
$('v-oggi').addEventListener('input',function(e){var t=e.target,k=t.dataset.ckt;if(!k)return;CK[k]=k==='int'?+t.value:t.value;if(k==='int')$('ck-int').textContent=t.value});

/* ---------- OBIETTIVI (REACH) ---------- */
var R=Z.reach,GOAL=null,gTimer=null;
function goals(){return G('io_goals_v1',[])}
function saveGoal(){var a=goals(),i=a.findIndex(function(x){return x.id===GOAL.id});GOAL.u=Date.now();if(i>=0)a[i]=GOAL;else a.unshift(GOAL);P('io_goals_v1',a)}
function renderObiettivi(){var h='';
  if(!GOAL){var a=goals();
    h+='<div class="card"><h3>REACH</h3><p>'+esc(R.intro)+'</p><div class="steps">'+R.phases.map(function(p){return '<div class="stp"><b>'+p.k+'</b><span><strong>'+esc(p.n)+'</strong> · '+esc(p.it)+'</span></div>'}).join('')+'</div><p class="note">'+esc(R.note)+'</p>'+ml(R.m)+'</div>'+
     '<div class="card"><label class="f">Nuovo obiettivo<input type="text" id="g-new" placeholder="Es. parlare in pubblico senza leggere"></label><div class="row"><button class="btn io" id="g-add">Crea</button></div></div>';
    if(a.length)h+='<div class="card"><h3>I miei obiettivi</h3>'+a.map(function(g){var n=Object.keys(g.done||{}).length;return '<div class="item"><div class="tx"><b>'+esc(g.t)+'</b><span>'+R.phases.map(function(p){return (g.done||{})[p.k]?'✓'+p.k:p.k}).join(' · ')+'</span><div class="bar" style="margin-top:6px"><i style="width:'+(n/5*100)+'%"></i></div></div><button class="btn" data-gopen="'+g.id+'">Apri</button></div>'}).join('')+'</div>';
    $('v-obiettivi').innerHTML=h;return}
  var g=GOAL,n=Object.keys(g.done||{}).length,next=R.phases.filter(function(p){return !(g.done||{})[p.k]})[0];
  h+='<div class="row"><button class="btn" id="g-back">← Obiettivi</button></div><div class="card"><label class="f">Obiettivo<input type="text" data-gt="t" value="'+esc(g.t)+'"></label><div class="bar"><i style="width:'+(n/5*100)+'%"></i></div><p class="muted">'+(next?'Prossima fase: '+next.n+' ('+next.it+')':'Tutte le fasi completate. Dopo Hold, si rilancia: nuovo obiettivo.')+'</p></div>';
  h+=R.phases.map(function(p){var dn=(g.done||{})[p.k];return '<details class="ph'+(dn?' dn':'')+'"'+(next===p?' open':'')+'><summary><span class="L">'+(dn?'✓':p.k)+'</span><span><b>'+esc(p.n)+'</b><small>'+esc(p.it)+(dn?' · fatta il '+new Date(dn).toLocaleDateString('it-IT'):'')+'</small></span><span class="chev">›</span></summary><div class="pb">'+
    '<p style="line-height:1.5;font-weight:600">'+esc(p.d)+'</p>'+
    p.tools.map(function(t){return '<div class="tool"><b>'+esc(t.n)+'</b><span class="tip">'+esc(t.d)+'</span><textarea data-gf="'+p.k+'.'+t.k+'" aria-label="'+esc(t.n)+'" placeholder="'+esc(t.p)+'">'+esc((g.f||{})[p.k+'.'+t.k]||'')+'</textarea></div>'}).join('')+
    '<div class="row"><button class="btn'+(dn?'':' io')+'" data-gdone="'+p.k+'">'+(dn?'Riapri la fase':(p.k==='C'?'Ho celebrato · +30 XP':'Fase completata · +10 XP'))+'</button></div>'+ml(p.m)+'</div></details>'}).join('');
  h+='<div class="row"><button class="btn" id="g-del">Elimina obiettivo</button></div><div id="g-msg"></div>';
  $('v-obiettivi').innerHTML=h}
$('v-obiettivi').addEventListener('click',function(e){var b,t=e.target;
  if(t.id==='g-add'){var v=$('g-new').value.trim();if(!v)return;GOAL={id:newId(),t:v,f:{},done:{}};saveGoal();renderObiettivi();window.scrollTo(0,0);return}
  if(b=t.closest('[data-gopen]')){GOAL=goals().filter(function(x){return x.id===b.dataset.gopen})[0]||null;renderObiettivi();window.scrollTo(0,0);return}
  if(t.id==='g-back'){GOAL=null;renderObiettivi();return}
  if(b=t.closest('[data-gdone]')){var k=b.dataset.gdone;GOAL.done=GOAL.done||{};if(GOAL.done[k])delete GOAL.done[k];else GOAL.done[k]=Date.now();saveGoal();renderObiettivi();return}
  if(t.id==='g-del'){if(t.textContent!=='Elimina?'){t.textContent='Elimina?';return}P('io_goals_v1',goals().filter(function(x){return x.id!==GOAL.id}));GOAL=null;renderObiettivi()}});
